{# Site header: Osprey logo + name, and the page's navigation.
   Set `page` to "dashboard" or "chat" before including. #}
<header class="topbar">
  <a class="brand" href="{{ url_for('home') }}" aria-label="{{ site_name }} home">
    <span class="brand-badge"><img src="{{ url_for('logo') }}" alt=""></span>
    <span class="brand-name">{{ site_name }}{% if page == "chat" %} <span class="brand-ai">AI</span>{% endif %}</span>
  </a>
  <nav class="topbar-nav">
    {% if page == "chat" %}
      <button type="button" class="nav-button" id="new-chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New chat
      </button>
      <a class="nav-link" href="{{ url_for('home') }}">Dashboard</a>
    {% else %}
      <a class="ask-button small" href="{{ url_for('chat') }}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M19 15l.8 1.9 1.9.8-1.9.8L19 20.4l-.8-1.9-1.9-.8 1.9-.8z"/></svg>Ask {{ site_name }} AI
      </a>
    {% endif %}
  </nav>
</header>
